<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perth Bears, Head of High Performance, Simon Thomas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0a0a0a;color:#eee}
.band{background:#0a0a0a;border-bottom:3px solid #B01020}
.band img{height:56px;display:block}
.nav-row{background:#111;border-bottom:1px solid #222;display:flex;overflow-x:auto}
.nb{background:transparent;border:none;border-bottom:3px solid transparent;color:#777;font-size:11px;font-weight:700;letter-spacing:.8px;padding:14px 20px;cursor:pointer;white-space:nowrap;font-family:Arial,sans-serif;text-transform:uppercase;transition:all .15s}
.nb:hover{color:#ddd;background:rgba(176,16,32,.1)}
.nb.on{color:#fff;border-bottom:3px solid #B01020;background:rgba(176,16,32,.18)}
.pg{display:none;padding:24px 28px 32px;min-height:calc(100vh - 112px)}
.pg.on{display:block}
.stag{display:inline-block;background:#B01020;color:#fff;font-size:8px;font-weight:700;letter-spacing:2px;padding:4px 12px;text-transform:uppercase;margin-bottom:10px}
h1{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;line-height:1.2}
.sub{font-size:12px;color:#999;font-style:italic;margin-bottom:16px;line-height:1.5}
.rl{height:2px;background:#B01020;margin-bottom:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.cd{background:#141414;border:.5px solid #222;border-radius:6px;overflow:hidden}
.cw{background:#f5f0f0;border:.5px solid #ddd;border-radius:6px;overflow:hidden}
.ct{height:4px;background:#B01020}
.ct.r2{background:#8C0C18}.ct.r3{background:#6A0A12}.ct.gr{background:#555}
.cb{padding:11px 13px}
.lb{font-size:8px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.lb.dk{color:#B01020}
.ti{font-size:12px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.2}
.ti.dk{color:#1a0508}
.fo{font-size:9.5px;font-style:italic;color:#cc8888;line-height:1.4;margin-bottom:7px;padding-bottom:7px;border-bottom:.5px solid #2a2a2a}
.sc{font-size:7.5px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px;margin-bottom:3px;margin-top:8px}
.sc:first-child{margin-top:0}
ul{list-style:none;padding:0}
ul li{font-size:10px;color:#ccc;line-height:1.45;padding-left:10px;position:relative;margin-bottom:2px}
ul li:before{content:"•";position:absolute;left:0;color:#B01020}
ul.dk li{color:#333}
.th{padding:10px 13px}
.th.r1{background:#B01020}.th.r2{background:#8C0C18}.th.r3{background:#6A0A12}
.tl{font-size:12px;font-weight:700;color:#fff}
.ts{font-size:9px;color:#ffcccc;margin-top:1px}
.strip{background:#1a0508;border-radius:6px;padding:10px 16px;display:flex;align-items:flex-start;gap:12px;margin-top:12px}
.sl{font-size:8.5px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;padding-top:1px}
.sv{font-size:10.5px;color:#ddd;line-height:1.55}
.vq{background:#1a0508;border-left:3px solid #B01020;border-radius:0 6px 6px 0;padding:12px 16px;margin-bottom:14px}
.vqp{font-size:11px;font-style:italic;color:#ddd;line-height:1.55;margin-bottom:6px}
.vqa{font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px}
.bc{background:#EDE7DC;border:.5px solid #d8d2c8;border-radius:6px;overflow:hidden}
.bch{font-size:26px;font-weight:900;color:#B01020;line-height:1;font-family:'Arial Black',Arial,sans-serif}
.bw{font-size:11px;font-weight:700;color:#182C4D;margin-bottom:3px}
.bp{font-size:9px;color:#555;line-height:1.35;margin-bottom:4px}
.bb{background:#1a0508;border-top:.5px solid #2a2a2a;padding:5px 12px;font-size:10px;color:#cc8888;font-style:italic;line-height:1.3}
.phrow{display:grid;grid-template-columns:84px 1fr;gap:8px;margin-bottom:7px;align-items:start}
.phb{background:#8C0C18;color:#fff;font-size:7px;font-weight:700;text-align:center;padding:4px 5px;letter-spacing:.4px;text-transform:uppercase;border-radius:3px}
.wb{display:inline-block;background:#6A0A12;color:#fff;font-size:7.5px;font-weight:700;padding:3px 7px;letter-spacing:.4px;text-transform:uppercase;border-radius:2px;margin-bottom:4px}
.kc{background:#f5f0f0;border:.5px solid #ddd;border-radius:6px;overflow:hidden}
.kb2{height:4px;background:#B01020}
.kb2.r2{background:#8C0C18}.kb2.r3{background:#6A0A12}
.kp{font-size:7.5px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.kt2{font-size:12px;font-weight:700;color:#1a0508;margin-bottom:7px;padding-bottom:5px;border-bottom:.5px solid #ddd}
.ss{background:#141414;border-radius:6px;padding:10px 14px;margin-top:12px}
.stt{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.stg{font-size:9px;color:#ccc;background:#242424;border:.5px solid #333;border-radius:3px;padding:3px 8px}
.rc{background:#1a0508;border-radius:6px;padding:8px 14px;display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;margin-top:12px}
.fig{background:#141414;border-left:3px solid #B01020;border-radius:0 6px 6px 0;padding:14px 16px;margin-top:14px}
.fh{font-size:14px;font-weight:700;color:#fff;margin-bottom:3px}
.fs{font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.fp{font-size:10.5px;color:#bbb;line-height:1.55}
.wklb{font-size:8px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.wklb.r2{color:#cc7777}.wklb.r3{color:#cc5555}.wklb.gr{color:#888}
.wkth{font-size:8.5px;color:#666;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
hr.tn{border:none;border-top:.5px solid #2a2a2a;margin:7px 0}
hr.lt{border-top-color:#ddd}
.inmid{font-size:9.5px;font-style:italic;color:#cc8888;line-height:1.4;margin-bottom:12px}
</style>
</head>

function perSel(el, i) {
  var wrap = el.closest('.per-wrap');
  if (!wrap) return;
  // Reset all cards
  var cards = wrap.querySelectorAll('[onclick^="perSel"]');
  cards.forEach(function(c) { c.style.borderColor = 'rgba(237,231,220,.1)'; });
  el.style.borderColor = ['#C8102E','#D6622A','#4E8A5E','#3F6BB0','#C46A8A','#D7A93A'][i];
  // Render detail
  var det = wrap.querySelector('.per-detail-panel');
  if (!det) return;
  var s = PER_SEASONS[i];
  var chips = s.points.map(function(p){return '<span style="display:inline-block;padding:3px 10px;border-radius:20px;border:1px solid '+s.color+';color:#EDE7DC;font-size:10px;font-weight:600;text-transform:uppercase;margin:2px 3px 2px 0">'+p+'</span>';}).join('');
  var lis = s.nrl.map(function(li){return '<li style="padding:5px 0 5px 16px;position:relative;color:#B9B2A6;font-size:12px;line-height:1.5;border-bottom:1px solid rgba(237,231,220,.06)"><span style="position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:'+s.color+';display:block"></span>'+li+'</li>';}).join('');
  det.innerHTML =
    '<div style="display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(237,231,220,.1);background:linear-gradient(90deg,'+s.color+'22,transparent)">'
    +'<img src="'+s.emblem+'" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0" alt="">'

{id:0, label:"01 · Framing", tag:"Response framework",
h:"This is a living planning framework, not a final template",
sub:"This response presents the thinking and philosophy that shapes the programme. The Head of High Performance will play a crucial part in not only recruiting, establishing and maximising the performance department, but will drive the process that interconnects all departments through policy, process and connection. Building the final detail is a collaborative process that happens together as all staff come online.",
body: function() {
  var html = '<div class="vq" style="padding:16px 20px;margin-bottom:18px">';
  html += '<div class="vqp" style="font-size:17px;line-height:1.75">&ldquo;Success begins with culture and the people who drive it. A strong and empowered culture is the foundation upon which every great club is built.&rdquo;</div>';
  html += '<div class="vqa" style="font-size:13px;margin-top:8px">Mal Meninga, Head Coach, Perth Bears</div>';
  html += '</div>';

  html += '<div class="g3" style="margin-bottom:18px">';
  html += '<div class="cw"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="lb dk" style="font-size:11px;margin-bottom:8px">A framework, not a template</div><p style="font-size:14px;color:#333;line-height:1.65">This response presents the thinking, philosophy and approach that shapes the programme. Specific session detail is layered in once collaborative inputs are confirmed with coaching, medical and football operations.</p></div></div>';
  html += '<div class="cw"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="lb dk" style="font-size:11px;margin-bottom:8px">Collaboration First · Build Details Together</div><p style="font-size:14px;color:#333;line-height:1.65">The Bears strategy is built on shared ownership. Critical questions that sharpen this plan are identified clearly, alongside a tiered approach that fits the organisation as it actually is, not as it might ideally be.</p></div></div>';
  html += '<div class="cw"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="lb dk" style="font-size:11px;margin-bottom:8px">Built to fit the Bears Way</div><p style="font-size:14px;color:#333;line-height:1.65">The short runway does not prevent setting a new standard. Even at NRL baseline resource and staffing, the connection and maximisation of people elevates delivery and sets the foundation for evolution toward NRL leading edge that others copy and follow.</p></div></div>';
  html += '</div>';

  html += '<div class="g3" style="margin-bottom:18px">';
  html += '<div class="cd"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="sc" style="font-size:11px;margin-bottom:8px">Three critical inputs</div><ul style="font-size:14.5px"><li style="margin-bottom:7px">Game model and in-season week structure (head coach driven)</li><li style="margin-bottom:6px">Staffing level, technology and budget confirmed</li><li>Facility access and commercial calendar locked</li></ul></div></div>';
  html += '<div class="cd"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="sc" style="font-size:11px;margin-bottom:8px">The tiered approach</div><ul style="font-size:13.5px"><li style="margin-bottom:6px">NRL baseline &mdash; functional and growing</li><li>NRL leading &mdash; fully resourced and integrated</li></ul></div></div>';
  html += '<div class="cd"><div class="ct"></div><div class="cb" style="padding:16px 18px"><div class="sc" style="font-size:11px;margin-bottom:8px">The constant</div><ul style="font-size:13.5px"><li style="margin-bottom:6px">Connect. Protect. Respect &mdash; in every session</li><li style="margin-bottom:6px">Football from Day 1 &mdash; culture lived, not presented</li><li>BEARS model embedded in daily behaviour</li></ul></div></div>';
  html += '</div>';

  html += '<div class="strip" style="padding:14px 20px;margin-bottom:14px"><div class="sl">The fig tree principle</div><div class="sv" style="font-size:14px">&ldquo;Deep roots. Grow tall.&rdquo; Every decision made now, including performance culture, must hold the club in good stead for many years to come. The performance environment being built before the first game is the root system everything else grows from.</div></div>';
  html += '<div style="background:rgba(201,162,39,.08);border-radius:6px;padding:16px 22px;margin-bottom:14px;border:1px solid rgba(201,162,39,.3)">';
  html += '<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:#C9A227;margin-bottom:8px">The Key Performance Principle</div>';
  html += '<p style="font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:20px;color:#E7B530;line-height:1.35;margin:0">Every session is a football session. Every football session is a culture session. Building cohesion in context is always faster than building it in isolation.</p>';
  html += '</div>';
  html += '<div style="background:#B01020;border-radius:6px;padding:20px 28px">';
  html += '<p style="font-size:16px;font-style:italic;color:#fff;line-height:1.85;text-align:center"><strong>A dynasty</strong> comes on the back of the first championship.<br><strong>The first championship</strong> comes on the back of the first training session of the year.<br><strong>The first training session</strong> comes on the back of the off-season planning.<br><strong>The off-season planning</strong> comes on the back of putting the right people in the right seats &mdash; to do the right things, at the right time, within the right environment.</p>';
  html += '</div>';
  return html;
}},

{id:1, label:"02 · B.E.A.R.S Model", tag:"Identity &amp; values",
h:"The B.E.A.R.S model, what it looks like when it is lived",
sub:"Bold. Empowered. Accountable. Resourceful. Selfless. The Bears have defined these clearly. What follows is what they actually look and feel like inside a performance environment.",
body: function() {
  var chars = [
    {l:"B",w:"Bold",ack:"Forward-facing, authentic, courageous.",
     div:"Boldness looks different across cultures and backgrounds. Someone raised to lead quietly is just as bold as someone who leads loudly. This characteristic makes space for every expression of it."},
    {l:"E",w:"Empowered",ack:"Self-leadership, initiative, inspiring others.",
     div:"Empowerment means people bring their own knowledge, instincts and lived experience to their role. A player who has trained under a different system, a different culture or a different philosophy brings something the group does not yet have. That is an asset."},
    {l:"A",w:"Accountable",ack:"Own decisions, earn respect through consistency.",
     div:"Accountability is universal. It transcends country, club and culture. When everyone holds themselves to it regardless of background, it becomes the common language that connects the group."},
    {l:"R",w:"Resourceful",ack:"Thrive under pressure, adaptive, growth mindset.",
     div:"People from different environments have solved different problems. That breadth of experience makes the group more resourceful collectively than any single background could. We draw on all of it."},
    {l:"S",w:"Selfless",ack:"Team above self, lead with humility, serve with purpose.",
     div:"Selflessness on Whadjuk Noongar Country carries particular meaning. Serving something bigger than yourself, the team, the club and the community, is a value that runs deep across cultures and gives everyone a reason to belong here."}
  ];
  var html = '<div class="g5" style="margin-bottom:18px">';
  for (var i=0;i<chars.length;i++) {
    var c=chars[i];
    html += '<div class="bc"><div class="cb"><div class="bch">'+c.l+'</div><div class="bw" style="font-size:14.5px">'+c.w+'</div><div class="bp" style="font-size:10px;color:#888;font-style:italic;line-height:1.35;margin-bottom:6px">'+c.ack+'</div><div style="font-size:11px;color:#B01020;line-height:1.5;border-top:1px solid #ccc6bc;padding-top:7px">'+c.div+'</div></div></div>';
  }
  html += '</div>';

  html += '<div style="font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">What this looks like when it is lived</div>';

  var rows = [
    {
      dir:"By players",
      desc:"Players who are living BEARS show up to every session prepared and on time. They know their own data, own their recovery and do not wait to be told what they need. When something is hard, they say so directly rather than hiding it. When a teammate is struggling, they step in without being asked. The training environment feels different when BEARS is operational versus aspirational."
    },
    {
      dir:"From players to staff",
      desc:"Players who trust the performance staff give honest feedback on how they are feeling, what is working and what is not. They ask questions. They challenge plans respectfully. They treat the physio, the sport scientist and the S&amp;C coach with the same respect they give the head coach, because they understand the department is one unit serving one outcome."
    },
    {
      dir:"By staff",
      desc:"Staff living BEARS do not protect their own lane. They share information across the department without being asked. They bring problems to the group before they become crises. They make decisions that are right for the player and the team even when those decisions are uncomfortable. They model the standard rather than enforce it."
    },
    {
      dir:"From staff to staff",
      desc:"A performance department where BEARS is genuinely operational has very few politics. People say what they think in the room, not after they leave it. Roles are clear and respected. Credit is shared. When someone is overloaded, others step in. The culture of the department is visible to players before a word is spoken about values."
    }
  ];

  html += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px">';
  for (var i=0;i<rows.length;i++) {
    var r=rows[i];
    html += '<div class="cd"><div class="ct"></div><div class="cb"><div class="lb" style="font-size:10px;margin-bottom:6px">'+r.dir+'</div><p style="font-size:13px;color:#ccc;line-height:1.65">'+r.desc+'</p></div></div>';
  }
  html += '</div>';

  html += '<div style="background:#1a0508;border-radius:6px;padding:14px 18px;margin-bottom:12px">';
  html += '<div style="font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px">How B.E.A.R.S underpins Connect, Protect, Respect</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">';
  html += '<div><div style="font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:28px;color:#fff;letter-spacing:.02em;line-height:1;margin-bottom:8px">Connect</div><p style="font-size:12.5px;color:#ccc;line-height:1.6">Bold and Empowered players and staff build genuine connections because they bring their real selves to the environment. There is no performative behaviour. Connection is a byproduct of people who feel safe enough to be honest.</p></div>';
  html += '<div><div style="font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:28px;color:#fff;letter-spacing:.02em;line-height:1;margin-bottom:8px">Protect</div><p style="font-size:12.5px;color:#ccc;line-height:1.6">Accountable and Selfless people protect each other by naming problems early, not late. They protect the standards by holding them even when no one is watching. Protection is not about rules, it is about people who have each other&rsquo;s backs.</p></div>';
  html += '<div><div style="font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:28px;color:#fff;letter-spacing:.02em;line-height:1;margin-bottom:8px">Respect</div><p style="font-size:12.5px;color:#ccc;line-height:1.6">Resourceful and Accountable people earn respect through what they do, not what they say. In the performance environment this means the data is trusted because the process is honest, and the relationships are trusted because the behaviours are consistent.</p></div>';
  html += '</div></div>';

  html += '<div style="background:#fff;border-radius:6px;padding:18px 22px">';
  html += '<div style="font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">Culture is not what is written on the wall</div>';
  html += '<p style="font-size:13.5px;color:#1a1a1a;line-height:1.75;margin-bottom:12px">Culture is not what is written on the wall. It comes from who we are, how we operate and how we live our values on a daily basis through actions that are visible and a feeling that is tangible. Every team in professional sport writes a slightly different version of the same thing on the wall. Some are absolutely committed to living it, owning it and evolving it. Most are not.</p>';
  html += '<p style="font-size:13.5px;color:#1a1a1a;line-height:1.75;font-weight:700">This needs to be one of those teams. The BEARS model is the starting point. What matters is what happens next, every day, in every room, long after the words have been agreed.</p>';
  html += '</div>';

  return html;
}},

{id:2, label:"03 · Department", tag:"Department approach",
h:"Building performance support, staffing, alignment &amp; integration",
sub:"Building performance support, staffing, alignment and integration before the detail is confirmed. The structure determines what the plan looks like. The plan scales with the resources available.",
body: function() {
  var tiers = [
    {cls:"r1",l:"Performance department",s:"NRL baseline to NRL leading · Built to evolve",
     staff:[
       "Head of HP",
       "Full-time applied performance scientist <span style='color:#E7B530;font-size:9px'>▲ 2× applied scientists (one integrated into analytics)</span>",
       "2 × S&amp;C coaches (rehab handled by medical) <span style='color:#E7B530;font-size:9px'>▲ 3× S&amp;C coaches (one dedicated to rehab &amp; non-selected)</span>",
       "Part-time dietitian <span style='color:#E7B530;font-size:9px'>▲ Full-time</span>",
       "Part-time mental skills provider <span style='color:#E7B530;font-size:9px'>▲ Full-time</span>",
       "<span style='color:#E7B530;font-size:9px'>▲ PT contractor specialists: Grappling, Boxing, Swimming, Pilates, Yoga · local provider or facility</span>",
       "Medical department (led by Head of Medical, TBD): 1× Head of Medical · 2–3× full-time physio · 1× full-time doctor (or 2× part-time) · contractor massage therapists and specialists"
     ],
     tech:[
       "Full GPS for entire squad + spare units",
       "Online AMS: automated dashboards and decision-making prompts <span style='color:#E7B530;font-size:9px'>▲ + staff management dashboard</span>",
       "<span style='color:#E7B530;font-size:9px'>▲ Integrated heart rate system in gym for targeted off-feet conditioning</span>",
       "<span style='color:#E7B530;font-size:9px'>▲ Access to heat chamber at WAIS</span>",
       "Force plates + hamstring board <span style='color:#E7B530;font-size:9px'>▲ + ForceFrame (hip, groin &amp; shoulder)</span>",
       "Timing gates for speed <span style='color:#E7B530;font-size:9px'>▲ + Vue Motion &amp; SpeedSig</span>",
       "Basic GymAware Flex for bar velocity <span style='color:#E7B530;font-size:9px'>▲ Full GymAware including cloud integration</span>",
       "Gym programming software (TeamBuildr etc) <span style='color:#E7B530;font-size:9px'>▲ full cloud &amp; AMS integration</span>",
       "<span style='color:#E7B530;font-size:9px'>▲ Leading edge: WHOOP or Oura Ring (recovery &amp; travel fatigue)</span>"
     ],
     pri:[
       "AMS platform operational from Day 1",
       "Weekly debrief with coaching group",
       "Roles clearly defined and delegated",
       "<span style='color:#E7B530;font-size:9px'>▲ Integrated data pipeline, individual load prescription, analytics to coaching group daily</span>"
     ]}
  ];
  var html = '<div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:20px;align-items:start">';
  html += '<div>';  // left column: department structure
  for (var i=0;i<tiers.length;i++) {
    var t=tiers[i];
    html += '<div class="cd"><div class="th '+t.cls+'"><div class="tl" style="font-size:13px">'+t.l+'</div><div class="ts">'+t.s+'</div></div>';
    html += '<div class="cb" style="padding:14px 18px"><div class="sc" style="font-size:10px;margin-bottom:8px">Staffing</div><ul>';
    for (var j=0;j<t.staff.length;j++) html += '<li style="margin-bottom:5px;font-size:11px;line-height:1.45">'+t.staff[j]+'</li>';
    html += '</ul><div class="sc" style="margin-top:14px;font-size:10px;color:#cc8888">Technology</div><ul>';
    for (var j=0;j<t.tech.length;j++) html += '<li style="color:#aaa;margin-bottom:5px;font-size:11px;line-height:1.45">'+t.tech[j]+'</li>';
    html += '</ul></div></div>';
  }
  html += '</div>';  // close left column

  // Right column: 2x2 KPI grid
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start">';

  html += '<div class="kc"><div class="kb2"></div><div class="kb" style="padding:12px 15px"><div class="kp" style="font-size:8.5px;margin-bottom:4px">Physical load</div><div class="kt2" style="font-size:13px;margin-bottom:10px">Session load &amp; match demands</div>';
  html += '<ul class="dk" style="font-size:11.5px"><li style="margin-bottom:7px;line-height:1.5;padding-left:12px">Session RPE and load: weekly in-season, mid-week in preseason to build player profiles</li><li style="margin-bottom:7px;line-height:1.5">GPS: high-speed running metres, contact volume, monotony and strain index</li><li style="margin-bottom:7px;line-height:1.5">Training availability % and post-travel readiness tracked each block</li></ul>';
  html += '</div></div>';

  html += '<div class="kc"><div class="kb2 r2"></div><div class="kb" style="padding:12px 15px"><div class="kp" style="font-size:8.5px;margin-bottom:4px">Readiness &amp; recovery</div><div class="kt2" style="font-size:13px;margin-bottom:10px">Objective + subjective blend</div>';
  html += '<ul class="dk" style="font-size:11.5px"><li style="margin-bottom:7px;line-height:1.5;padding-left:12px">Wellness: sleep, fatigue, mood, soreness. Weekly in-season, mid-week in preseason</li><li style="margin-bottom:7px;line-height:1.5">HRV vs. individual baseline: WHOOP, Oura Ring or subjective where not available</li><li style="margin-bottom:7px;line-height:1.5">Post-game and post-travel recovery tracked for 48 hours minimum</li></ul>';
  html += '</div></div>';

  html += '<div class="kc"><div class="kb2 r3"></div><div class="kb" style="padding:12px 15px"><div class="kp" style="font-size:8.5px;margin-bottom:4px">Cultural &amp; connection</div><div class="kt2" style="font-size:13px;margin-bottom:10px">Standards ownership and belonging</div>';
  html += '<ul class="dk" style="font-size:9.5px"><li style="margin-bottom:4px;line-height:1.45;padding-left:11px">CPR self-reflection: weekly mirror moment, not a checklist</li><li style="margin-bottom:4px;line-height:1.45">Standards ownership: do players own them when no one is watching?</li><li style="margin-bottom:4px;line-height:1.45">Self and peer accountability through observation and conversation</li><li style="line-height:1.45">Connection: can anyone sit with anyone?</li><li style="line-height:1.45">Do families feel welcome?</li></ul>';
  html += '</div></div>';

  html += '<div class="kc"><div style="height:4px;background:#B01020"></div><div class="kb" style="padding:12px 15px"><div class="kp" style="font-size:8.5px;margin-bottom:4px">Staff as high performers</div><div class="kt2" style="font-size:13px;margin-bottom:10px">Their load counts too</div>';
  html += '<ul class="dk" style="font-size:11.5px"><li style="margin-bottom:7px;line-height:1.5;padding-left:12px">Working hours and travel load tracked alongside players</li><li style="margin-bottom:7px;line-height:1.5">Weekly wellbeing check-in, 1:1 with HoHP monthly minimum</li><li style="margin-bottom:7px;line-height:1.5">Connection: can anyone sit with anyone?</li><li style="margin-bottom:7px;line-height:1.5">No one carries something alone. Staff support each other the way we ask players to.</li></ul>';
  html += '</div></div>';

  html += '</div>';  // close right column

  html += '</div>';  // close 2-col grid

  html += '<div style="background:#B01020;border-radius:6px 6px 0 0;padding:14px 20px;margin-top:18px">';
  html += '<div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:4px">Cultural KPIs for the department</div>';
  html += '<div style="font-size:11px;color:#ffcccc;line-height:1.55">What each value looks like measured visually, daily. Not aspirational. Operational. I am accountable to these in the same way I hold players and staff accountable to the BEARS characteristics.</div>';
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:.5px solid #2a2a2a;border-top:none;border-radius:0 0 6px 6px;overflow:hidden">';

  var vals = [
    {v:"Connect",body:"Every decision starts with the person, not the programme. How we treat people when it is inconvenient is the actual measure of this value.",vis:"1:1s happen before system reviews. Wellbeing is the first agenda item. No one leaves the room without being heard.",cpr:"Looks like: People First: relationships are the infrastructure. Everything else is built on top of them."},
    {v:"Protect",body:"We are here because the work matters. The best idea wins regardless of where it comes from. Ego and hierarchy do not drive decisions.",vis:"Credit is shared publicly. Ideas are challenged on merit, not seniority.",cpr:"Looks like: Meaning Over Status: a department built on meaning protects its people from politics, credit-chasing and comparison."},
    {v:"Respect",body:"Doing the work properly is how we show respect to the people we serve. High standards are about taking people seriously, not perfectionism.",vis:"Meetings have an agenda. Data is interrogated. Reports are clear and on time. I hold myself to this first.",cpr:"Looks like: Rigour is Respect: rigour makes the data trustworthy and the relationships durable."}
  ];
  for (var i=0;i<vals.length;i++) {
    var v=vals[i];
    var bdr = i<2 ? 'border-right:.5px solid #2a2a2a;' : '';
    var looksLikeParts = v.cpr.split(':');
    var looksLikeValue = looksLikeParts[1] ? looksLikeParts[1].trim() : '';
    var looksLikeBody = looksLikeParts.slice(2).join(':').trim();
    html += '<div style="background:#141414;padding:18px 18px;'+bdr+'">';
    html += '<div style="font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:24px;color:#fff;letter-spacing:.02em;line-height:1;margin-bottom:10px">'+v.v+'</div>';
    html += '<div style="display:inline-flex;align-items:baseline;gap:6px;background:rgba(176,16,32,.12);border:1px solid rgba(176,16,32,.4);border-radius:4px;padding:5px 10px;margin-bottom:10px">';
    html += '<span style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#B01020;white-space:nowrap">Looks like</span>';
    html += '<span style="font-size:11px;font-weight:700;color:#fff;white-space:nowrap">'+looksLikeValue+'</span>';
    html += '</div>';
    html += '<p style="font-size:9.5px;color:#888;line-height:1.45;margin-bottom:10px;font-style:italic">'+looksLikeBody+'</p>';
    html += '<p style="font-size:10.5px;color:#ccc;line-height:1.55;margin-bottom:10px">'+v.body+'</p>';
    html += '<div style="background:#0a0a0a;border-radius:4px;padding:8px 12px;border-left:3px solid #B01020">';
    html += '<div style="font-size:7.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#B01020;margin-bottom:4px">Daily measure</div>';
    html += '<p style="font-size:10.5px;color:#fff;line-height:1.5;margin:0">'+v.vis+'</p>';
    html += '</div>';
    html += '</div>';
  }
  html += '</div>';

  return html;
}},

  html += '<p style="font-size:10px;color:#ddd;line-height:1.5;max-width:900px;margin:0 auto">Football integration through field session structure provides the position-relevant work naturally. Physical development is individual, not positional. Two questions drive every player programme:</p>';
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  html += '<div style="background:#1a1a1a;border-radius:4px;padding:10px 12px"><div style="font-size:8.5px;font-weight:700;color:#E7B530;margin-bottom:4px">Superpower → Keep &amp; Intensify</div><p style="font-size:10.5px;color:#ccc;line-height:1.5;margin:0">What does this player do exceptionally well that we need more of? Build the programme around protecting and amplifying it.</p></div>';
  html += '<div style="background:#1a1a1a;border-radius:4px;padding:10px 12px"><div style="font-size:8.5px;font-weight:700;color:#B01020;margin-bottom:4px">Limiting Factor → Develop &amp; Improve</div><p style="font-size:10.5px;color:#ccc;line-height:1.5;margin:0">What is holding this player back from contributing fully in their role? Address it specifically. Who they are and what we need determines the priority.</p></div>';
  html += '</div></div>';
  

  var wks = [
    {wk:"Week 1",wc:"",tc:"",th:"Arrive &amp; connect",
     load:"Low % of peak intensity. Maximum conditioning from football and skill work.",
     gauge:{wkVol:[60,70],wkInt:[60,70],sesRPE:"5–6",sesInt:"60–70%",col:"#C8102E",season:"birak",run:55,contact:40,runInt:60,contactInt:45},
     test:"Aerobic capacity and conditioning baseline",

     cul:["Day 1 sets the tone we will reflect on in week four","1:1 with HoHP within first 48 hours","Non-negotiables set as a group","CPR introduced and lived immediately"]},
    {wk:"Week 2",wc:"r2",tc:"r2",th:"Assess &amp; build",
     load:"Building toward 40 to 50% of peak intensity. Contact introduced.",
     gauge:{wkVol:[70,80],wkInt:[70,75],sesRPE:"6–7",sesInt:"70–75%",col:"#D6622A",season:"bunuru",run:65,contact:55,runInt:70,contactInt:60},
     test:"CMJ and power outputs",
     method:"Grappling and wrestling conditioning integrated with running and skill work. Sessions alternate between the two.",
     phy:["Running, skill and contact conditioning alternating","Gym load progression","Individual load profiles forming","Heat training part of every outdoor session"],
     cul:["Accountability structures embedded","Staff-player relationships building","First coaching group HP debrief","Cultural observations shared with leadership"]},
    {wk:"Week 3",wc:"r3",tc:"r3",th:"Push &amp; observe",
     load:"Approaching 60 to 70% of peak intensity. Highest contact and running volume of the block.",
     gauge:{wkVol:[85,95],wkInt:[80,90],sesRPE:"7–8",sesInt:"80–90%",col:"#4E8A5E",season:"djeran",run:80,contact:75,runInt:85,contactInt:80},
     test:"Max velocity, speed and acceleration",
     method:"Everything integrated into match-style scenarios. Contact and running conditioning together. Remedial groups complete extra work based on individual needs.",
     phy:["Match-style scenarios with contact integrated","Football integrated into speed and conditioning: field structure provides individual skill and team cohesion windows","Recovery protocols tested under fatigue","GPS informing individual load daily"],
     cul:["Standards held peer-to-peer","Emerging leaders identified","Friction addressed early","BEARS characteristics in behaviour, not just language"]},
    {wk:"Week 4",wc:"gr",tc:"gr",th:"Variation (or Camp) Week",
     load:"Load drops significantly. Explosive power and speed focus. Off-site sessions.",
     gauge:{wkVol:[65,75],wkInt:[65,75],sesRPE:"5–6",sesInt:"65–75%",col:"#3F6BB0",season:"makuru",run:60,contact:50,runInt:65,contactInt:55},
     test:"Maximal strength and heavy power outputs",
     method:"Heavy gym during the deload when the body can express true output. Off-site sessions including hills, beach and external facilities depending on budget.",
     phy:["Explosive power and speed as the focus","Off-site sessions (budget dependent)","Active recovery between sessions","Individual gap work from weeks 1 to 3"],
     cul:["Week four checkpoint: what did we want to see, what did we see, how do we close the gaps before the game teaches us","Team-building on and off field","Group reflection led by the group","Re-anchor to CPR before intensity block"]}
  ];

  html += '<div class="g4" style="margin-bottom:16px">';
  for (var i=0;i<wks.length;i++) {
    var w=wks[i];
    html += '<div class="cd"><div class="ct '+w.tc+'"></div><div class="cb" style="padding:14px 13px">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px">';
    html += '<div><div class="wklb" style="font-size:11px" '+w.wc+'" style="font-size:9px">'+w.wk+'</div>';
    html += '<div class="wkth" style="font-size:9px">'+w.th+'</div></div>';
    html += '<img src="'+(WEEK_EMBLEMS[w.gauge.season]||'')+'" style="width:30px;height:30px;border-radius:50%;opacity:.9;object-fit:cover;flex-shrink:0" alt="">';
    html += '</div>';
    html += '<div style="margin-bottom:7px;padding:7px 10px;background:#0a0a0a;border-radius:5px;border-top:2px solid '+w.gauge.col+'">'+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:3px"><div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888">&#128197; Weekly vol '+w.gauge.wkVol[0]+'–'+w.gauge.wkVol[1]+'%</div><div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888">&#9889; Weekly int '+w.gauge.wkInt[0]+'–'+w.gauge.wkInt[1]+'%</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px"><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Running load</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+w.gauge.run+'%;opacity:.9;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.run+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Running intensity</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+(w.gauge.runInt/1.2)+'%;opacity:.9;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.runInt+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Contact load</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+w.gauge.contact+'%;opacity:.7;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.contact+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Contact intensity</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+(w.gauge.contactInt/1.2)+'%;opacity:.7;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.contactInt+'% peak</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid #222;padding-top:5px"><div style="font-size:8px;color:#aaa"><span style="color:'+w.gauge.col+';font-weight:700">&#9672; Ses max RPE: </span>'+w.gauge.sesRPE+'</div><div style="font-size:8px;color:#aaa"><span style="color:'+w.gauge.col+';font-weight:700">&#9651; Ses max intensity: </span>'+w.gauge.sesInt+'</div></div></div>';
    html += '<div style="font-size:8.5px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Testing</div>';
    html += '<div style="font-size:11px;font-weight:700;color:#fff;margin-bottom:6px;padding-bottom:6px;border-bottom:.5px solid #2a2a2a">'+w.test+'</div>';
    html += '<div style="font-size:8.5px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Method</div>';
    html += '<p style="font-size:10.5px;color:#bbb;line-height:1.5;margin-bottom:8px;padding-bottom:8px;border-bottom:.5px solid #2a2a2a">'+w.method+'</p>';
    html += '<div class="sc" style="font-size:8.5px">Physical</div><ul>';
    for (var j=0;j<w.phy.length;j++) html += '<li style="font-size:10.5px;margin-bottom:4px">'+w.phy[j]+'</li>';
    html += '</ul><div class="sc" style="font-size:7px;margin-top:5px">Culture</div><ul>';
    for (var j=0;j<w.cul.length;j++) html += '<li style="font-size:10.5px;margin-bottom:4px">'+w.cul[j]+'</li>';
    html += '</ul></div></div>';
  }
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px">';
  html += '<div class="cw"><div class="ct"></div><div class="cb"><div class="lb dk">Heat as a weapon</div><p style="font-size:12px;color:#333;line-height:1.6;margin-top:6px">We train and play in Perth’s heat more consistently than any visiting team. Train in it, normalise it, then let visiting teams manage it at game time. Being smart about when and how we use it is critical.</p></div></div>';
  html += '<div class="cw"><div class="ct"></div><div class="cb"><div class="lb dk">Maximise the preseason window</div><p style="font-size:12px;color:#333;line-height:1.6;margin-top:6px">Once the in-season begins, travel constrains training access every week. The preseason is the only period of full control. Volume, density, environment and cohesion are built here.</p></div></div>';
  html += '<div class="cw"><div class="ct"></div><div class="cb"><div class="lb dk">Practise all week models now</div><p style="font-size:12px;color:#333;line-height:1.6;margin-top:6px">Every in-season week type is rehearsed in preseason so there are no surprises. Travel weeks, back-to-back aways, compressed windows. Practised is just process. Unfamiliar is stressful.</p></div></div>';
  html += '</div>';

  
  return html;
}},

{id:5, label:"06 · Weeks 5–7", tag:"Intensity block",
h:"Weeks 5–7 — compete, prove, prepare",
sub:"The in-season week model is the anchor of preseason planning. Built backward from what the season week needs to look like, driven by the head coach, advised by HoHP.",
body: function() {
  var html = '<div style="font-size:8px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px">Load framework: % of peak match intensity · % of peak match load · % of peak in-season weekly load (including travel and mental strain)</div>';
  html += '<div style="font-size:11px;color:#777;font-style:italic;margin-bottom:18px">Travel weeks are genuine stressors: transit time, disrupted sleep, compressed training windows and cognitive load. Practised in preseason so they are normal by round one.</div>';

  var wks = [
    {wk:"Week 5",wc:"",tc:"",th:"Push the ceiling",
     load:"Approaching 80% of peak match intensity. Weekly load at or near peak preseason volume. Contact density increasing toward match simulation.",
     gauge:{wkVol:[95,105],wkInt:[90,100],sesRPE:"8–9",sesInt:"90–100%",col:"#C46A8A",season:"djilba",run:90,contact:85,runInt:95,contactInt:88},
     phy:["Peak loading cycle begins","High-intensity field sessions with contact","Competition simulation introduced","Gym: strength and power expression","Heat training at highest intensity, consistent exposure advantage being built"],
     cul:["Standards held by the group, not staff","Pressure moments manufactured and coached through","CPR language operational, not aspirational","Feel It. Do not Feed It. in practice"]},
    {wk:"Week 6",wc:"r2",tc:"r2",th:"Compete &amp; integrate",
     load:"Game intensity introduced. Weekly load managed around match day. All four in-season week model types rehearsed.",
     gauge:{wkVol:[100,110],wkInt:[95,110],sesRPE:"≤9",sesInt:"95–110%",col:"#D7A93A",season:"kambarang",run:100,contact:95,runInt:105,contactInt:100},
     phy:["Preseason game protocols if scheduled","All four week model formats rehearsed so none is unfamiliar in-season","Post-game recovery protocol executed and reviewed","Travel week protocols rehearsed: abbreviated sessions, recovery logistics, execution over volume","Late arrivals fully integrated on individual ramp"],
     cul:["Game-week culture established","Debrief: performance and standards together","Who leads under pressure identified","HP + medical + analysis: unified debrief process"]},
    {wk:"Week 7",wc:"r3",tc:"r3",th:"Sharpen &amp; confirm",
     load:"Load tapers toward Christmas break. In-season weekly load profile rehearsed in full including travel and mental load.",
     gauge:{wkVol:[75,85],wkInt:[95,110],sesRPE:"7–9",sesInt:"95–110%",col:"#C8102E",season:"birak",run:75,contact:70,runInt:100,contactInt:95},
     phy:["Volume taper but intensity stays high","Final retests: CMJ, readiness, wellness vs. baseline","Individual readiness profiles completed and shared with coaching group","Post-block debrief with coaching group"],
     cul:["Christmas break standards set collectively","Return-to-training contract agreed as a group","Reflection: what the group has become since Day 1","Foundation confirmed, in-season begins with no surprises"]}
  ];

  html += '<div class="g3" style="margin-bottom:18px">';
  for (var i=0;i<wks.length;i++) {
    var w=wks[i];
    html += '<div class="cw"><div class="ct '+w.tc+'"></div><div class="cb" style="padding:16px 18px">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:5px">';
    html += '<div><div class="wklb" style="font-size:11px;color:#B01020" '+w.wc+'">'+w.wk+'</div>';
    html += '<div class="wkth" style="color:#555">'+w.th+'</div></div>';
    html += '<img src="'+(WEEK_EMBLEMS[w.gauge.season]||'')+'" style="width:30px;height:30px;border-radius:50%;opacity:.9;object-fit:cover;flex-shrink:0" alt="">';
    html += '</div>';
    html += '<div style="margin-bottom:7px;padding:7px 10px;background:#0a0a0a;border-radius:5px;border-top:2px solid '+w.gauge.col+'">'+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:3px"><div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888">&#128197; Weekly vol '+w.gauge.wkVol[0]+'–'+w.gauge.wkVol[1]+'%</div><div style="font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888">&#9889; Weekly int '+w.gauge.wkInt[0]+'–'+w.gauge.wkInt[1]+'%</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px"><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Running load</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+w.gauge.run+'%;opacity:.9;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.run+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Running intensity</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+(w.gauge.runInt/1.2)+'%;opacity:.9;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.runInt+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Contact load</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+w.gauge.contact+'%;opacity:.7;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.contact+'% peak</div></div><div><div style="font-size:6.5px;color:#aaa;margin-bottom:2px">Contact intensity</div><div style="background:rgba(255,255,255,.18);border-radius:3px;height:7px;overflow:hidden"><div style="height:100%;background:'+w.gauge.col+';width:'+(w.gauge.contactInt/1.2)+'%;opacity:.7;border-radius:3px"></div></div><div style="font-size:7.5px;color:'+w.gauge.col+';font-weight:700;margin-top:1px">'+w.gauge.contactInt+'% peak</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid #222;padding-top:5px"><div style="font-size:8px;color:#aaa"><span style="color:'+w.gauge.col+';font-weight:700">&#9672; Ses max RPE: </span>'+w.gauge.sesRPE+'</div><div style="font-size:8px;color:#aaa"><span style="color:'+w.gauge.col+';font-weight:700">&#9651; Ses max intensity: </span>'+w.gauge.sesInt+'</div></div></div>';
    html += '<div class="sc" style="color:#8C0C18;font-size:9.5px">Physical &amp; load</div><ul class="dk">';
    for (var j=0;j<w.phy.length;j++) html += '<li style="margin-bottom:3px;font-size:10.5px">'+w.phy[j]+'</li>';
    html += '</ul><div class="sc" style="color:#8C0C18;margin-top:12px;font-size:9.5px">Culture &amp; behaviour</div><ul class="dk">';
    for (var j=0;j<w.cul.length;j++) html += '<li style="margin-bottom:3px;font-size:10.5px">'+w.cul[j]+'</li>';
    html += '</ul></div></div>';
  }
  html += '</div>';

  html += '<div style="background:#1a0508;border-radius:6px;padding:16px 20px;margin-bottom:14px">';
  html += '<div style="font-size:9px;font-weight:700;color:#C9A227;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">The staggered arrival protocol</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">';
  var phases = [
    {p:"Pre-arrival",items:["Culture docs and squad contacts sent","Wellness baseline requested","Medical clearance reviewed"]},
    {p:"Day 1",items:["1:1 with HoHP, connection before conditioning","Buddy assigned from existing squad","Facility and team orientation"]},
    {p:"Week 1",items:["Individual load ramp, not matched to squad","Cultural integration prioritised","Daily check-in with HoHP"]},
    {p:"Week 2+",items:["1:1 progressive ramping: 1 week late = 1 week ramp, 2 weeks late = 2 week ramp","Same standards as the squad","Full accountability active"]}
  ];
  for (var i=0;i<phases.length;i++) {
    var ph=phases[i];
    html += '<div><div style="background:#C9A227;color:#1a1a1a;font-size:7.5px;font-weight:700;text-align:center;padding:3px 6px;border-radius:3px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">'+ph.p+'</div><ul style="list-style:none;padding:0">';
    for (var j=0;j<ph.items.length;j++) html += '<li style="font-size:11px;color:#ccc;padding-left:9px;position:relative;margin-bottom:3px;line-height:1.35"><span style="position:absolute;left:0;color:#B01020">•</span>'+ph.items[j]+'</li>';
    html += '</ul></div>';
  }
  html += '</div></div>';

  html += '<div style="background:#0a0a0a;border-radius:6px;padding:16px 20px;margin-bottom:14px;border:1px solid rgba(201,162,39,.2)">';
  html += '<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#C9A227;margin-bottom:12px">Squad variability</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">';

  html += '<div><div style="font-size:9px;font-weight:700;color:#E7B530;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">Preseason build</div>';
  html += '<p style="font-size:10.5px;color:#ddd;line-height:1.55;margin-bottom:8px">Squad size is variable through staggered club releases and international commitments. Managed by starting small and building out:</p>';
  html += '<ul style="list-style:none;padding:0;margin:0">';
  html += '<li style="font-size:10.5px;color:#ccc;padding-left:14px;position:relative;margin-bottom:5px;line-height:1.45"><span style="position:absolute;left:0;color:#E7B530">&#9654;</span>Small-group skill work and small-space conditioning games first</li>';
  html += '<li style="font-size:10.5px;color:#ccc;padding-left:14px;position:relative;margin-bottom:5px;line-height:1.45"><span style="position:absolute;left:0;color:#E7B530">&#9654;</span>Spaces widen as the group grows. Individual work transitions to team cohesion.</li>';
  html += '<li style="font-size:10.5px;color:#ccc;padding-left:14px;position:relative;line-height:1.45"><span style="position:absolute;left:0;color:#E7B530">&#9654;</span>Group size and field area manage progressive load naturally</li>';
  html += '</ul></div>';

  html += '<div><div style="font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">In-season: non-selected player tensions</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">';
  html += '<div style="background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.25);border-radius:5px;padding:9px 11px"><div style="font-size:8.5px;font-weight:700;color:#C9A227;margin-bottom:4px">Time in our environment</div><p style="font-size:9.5px;color:#B9B2A6;line-height:1.45;margin:0">Culture, connection and identity built at base</p></div>';
  html += '<div style="background:rgba(176,16,32,.08);border:1px solid rgba(176,16,32,.25);border-radius:5px;padding:9px 11px"><div style="font-size:8.5px;font-weight:700;color:#B01020;margin-bottom:4px">Quality football exposure</div><p style="font-size:9.5px;color:#B9B2A6;line-height:1.45;margin:0">Meaningful 2nd-tier games on the east coast</p></div>';
  html += '<div style="background:rgba(176,16,32,.08);border:1px solid rgba(176,16,32,.25);border-radius:5px;padding:9px 11px"><div style="font-size:8.5px;font-weight:700;color:#B01020;margin-bottom:4px">Travel load</div><p style="font-size:9.5px;color:#B9B2A6;line-height:1.45;margin:0">Perth to east coast counts as load for everyone</p></div>';
  html += '<div style="background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.25);border-radius:5px;padding:9px 11px"><div style="font-size:8.5px;font-weight:700;color:#C9A227;margin-bottom:4px">Connection to culture</div><p style="font-size:9.5px;color:#B9B2A6;line-height:1.45;margin:0">Disconnection is a performance and culture risk</p></div>';
  html += '</div>';
  html += '<p style="font-size:9.5px;color:#888;font-style:italic;margin-top:8px;line-height:1.4">The right answer depends on the player, the week and the competition. Navigated collaboratively.</p>';
  html += '</div></div></div>';

  html += '<div class="strip"><div class="sl">Key date note</div><div class="sv" style="font-size:11px">Christmas break, preseason games, travel and camps mapped once confirmed. The model adapts to hard dates, the principles do not change. See the Bonus · In-Season Week Models tab for the full in-season week model quadrant.</div></div>';
  return html;
}},

{id:6, label:"Bonus · In-Season Week Models", tag:"Bonus reference",
h:"The in-season week model quadrant",
sub:"We will not have a routine week structure that repeats more than 50% of the time. That is not a problem, it is a strength. The principle is consistent even when the schedule is not: develop at the front of the week, perform at the end.",
body: function() {
  var html = '<div style="background:#2C0A0E;border:2px solid #B01020;border-radius:8px;padding:16px 22px;margin-bottom:18px">';
  html += '<div style="font-size:10px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Why in-season week models are in a preseason exercise</div>';
  html += '<p style="font-size:12.5px;color:#fff;line-height:1.7;margin-bottom:7px">The in-season week model is the anchor point that the preseason week schedule should be planned back from. Not the other way around.</p>';
  html += '<p style="font-size:12px;color:#ddd;line-height:1.65;margin-bottom:0">Too many teams build a preseason week structure and then switch to a different in-season structure when competition begins. That switch disrupts performance rhythm, breaks established habits and forces players and staff to readapt at exactly the moment the margins matter most. The preseason should be a rehearsal for the season, not a different programme that happens before it.</p>';
  html += '</div>';
  html += '<div style="font-size:11.5px;color:#ccc;line-height:1.65;margin-bottom:16px">Every in-season week type is practised in preseason. When we arrive at a travel week or a back-to-back away, it is not new. It is just one of our week models. With the right framing, travel is not a negative. It is a performance tool we know how to use.</div>';

  html += '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px">';
  var quadrants = [
    {status:"GOLD",sc:"#C9A227",bg:"#1a1600",border:"#C9A227",
     title:"Home → Home",sub:"Golden weeks. Load up.",
     desc:"Full training access, home environment, no travel disruption. The weeks where physical development compounds fastest. Protect them, use them.",
     md:"Home game execution. Pre and post protocols by HoHP.",
     md1:"Day off at home. We protect this. Time away is coming.",
     md2:"High information load. Physical load determined by week model.",
     front:"Full training load, technical development, high volume.",
     back:"Sharpen, prime, execute."},
    {status:"SILVER",sc:"#AAAAAA",bg:"#161616",border:"#555",
     title:"Home → Away",sub:"Silver. Load the front.",
     desc:"Load confidently while training access is at home. The back end is interrupted by travel. Execution quality becomes the priority as the week progresses. Volume drops, intensity stays high.",
     md:"Home game execution.",
     md1:"Day off at home. Travel planning begins.",
     md2:"Moderate physical load, high information before travel window.",
     front:"Full load at home while we have access.",
     back:"Compressed. Travel logistics. Execution focus."},
    {status:"SILVER",sc:"#AAAAAA",bg:"#161616",border:"#555",
     title:"Away → Home",sub:"Lighter start. Ramp home.",
     desc:"Generally starts lighter due to post-travel recovery. The week builds as the body resets and home access is restored. Ramp intensity toward the home game.",
     md:"Away game execution.",
     md1:"Travel day or recovery flush. Flight timing matters.",
     md2:"Light load. High information. Physical reactivation.",
     front:"Recovery and reactivation while travel fatigue clears.",
     back:"Full ramp toward home game. Capitalise on home environment."},
    {status:"MANAGE",sc:"#B01020",bg:"#1a0508",border:"#B01020",
     title:"Away → Away",sub:"Design the week deliberately.",
     desc:"Stay away and accept facility constraints, or fly back and accept low volume but high execution. Neither is wrong. The decision is made on what is best for that specific week.",
     md:"Away game execution.",
     md1:"Travel day or recovery on the road.",
     md2:"High information. Low to moderate physical depending on stay-or-return decision.",
     front:"Solid training if staying away. Manage constraints deliberately.",
     back:"Execution stays high regardless of volume. Familiarity built in preseason."}
  ];

  for (var i=0;i<quadrants.length;i++) {
    var q=quadrants[i];
    html += '<div style="background:'+q.bg+';border:.5px solid '+q.border+';border-radius:8px;overflow:hidden">';
    html += '<div style="background:'+q.border+';padding:10px 16px;display:flex;align-items:center;gap:10px">';
    html += '<div style="font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);border-radius:3px;padding:2px 9px;white-space:nowrap">'+q.status+'</div>';
    html += '<div style="font-size:14px;font-weight:700;color:#fff">'+q.title+'</div>';
    html += '<div style="font-size:9.5px;color:rgba(255,255,255,.7);margin-left:auto">'+q.sub+'</div>';
    html += '</div>';
    html += '<div style="padding:16px 18px">';
    html += '<p style="font-size:11px;color:#ccc;line-height:1.6;margin-bottom:12px">'+q.desc+'</p>';
    html += '<div style="display:grid;grid-template-columns:72px 1fr;gap:5px;font-size:10px;margin-bottom:3px"><div style="font-weight:700;color:'+q.sc+'">MD</div><div style="color:#bbb">'+q.md+'</div></div>';
    html += '<div style="display:grid;grid-template-columns:72px 1fr;gap:5px;font-size:10px;margin-bottom:3px"><div style="font-weight:700;color:'+q.sc+'">MD +1</div><div style="color:#bbb">'+q.md1+'</div></div>';
    html += '<div style="display:grid;grid-template-columns:72px 1fr;gap:5px;font-size:10px;margin-bottom:12px"><div style="font-weight:700;color:'+q.sc+'">MD +2</div><div style="color:#bbb">'+q.md2+'</div></div>';
    html += '<div style="height:.5px;background:#2a2a2a;margin-bottom:10px"></div>';
    html += '<div style="font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:3px">Front of week</div>';
    html += '<div style="font-size:10.5px;color:#ddd;margin-bottom:8px">'+q.front+'</div>';
    html += '<div style="font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-bottom:3px">Back of week</div>';
    html += '<div style="font-size:10.5px;color:#ddd">'+q.back+'</div>';
    html += '</div></div>';
  }
  html += '</div>';

  html += '<div style="background:#fff;border-radius:6px;padding:18px 24px">';
  html += '<div style="font-size:9px;font-weight:700;color:#B01020;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px">The principle that never changes</div>';
  html += '<p style="font-size:12.5px;color:#1a1a1a;line-height:1.7;margin-bottom:8px">Our actual routine is this: we will do what is best for this specific week. The schedule may not look the same from one week to the next. The principle always does.</p>';
  html += '<p style="font-size:13px;font-weight:700;color:#1a1a1a;line-height:1.65;margin-bottom:8px">How do we use the front of this week to develop, and how do we use the end of this week to perform?</p>';
  html += '<p style="font-size:12.5px;color:#1a1a1a;line-height:1.7">We get creative. We challenge the status quo because our preparation situation is unique. No other club in the NRL faces this and no other club will be as good at it as us. These week models are not constraints. They are weapons.</p>';
  html += '</div>';
  return html;
}}
];

var nav = document.getElementById('nav');
var pages = document.getElementById('pages');

for (var i=0; i<data.length; i++) {
  (function(sl) {
    var btn = document.createElement('button');
    btn.className = 'nb' + (sl.id === 0 ? ' on' : '');
    btn.innerHTML = sl.label;
    btn.onclick = function() {
      document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on');});
      document.getElementById('pg'+sl.id).classList.add('on');
      window.scrollTo(0,0);
    };
    nav.appendChild(btn);

    var div = document.createElement('div');
    div.className = 'pg' + (sl.id === 0 ? ' on' : '');
    div.id = 'pg' + sl.id;
    div.innerHTML = '<div class="stag">'+sl.tag+'</div><h1>'+sl.h+'</h1><div class="sub">'+sl.sub+'</div><div class="rl"></div>' + sl.body();
    pages.appendChild(div);
  })(data[i]);
}
document.getElementById('dhtImg2').src = dhtImg;
// Style bonus tab distinctly
var btns = document.querySelectorAll('.nb');
btns.forEach(function(b) {
  if (b.innerHTML.indexOf('Bonus') > -1) {
    b.style.background = '#fff';
    b.style.color = '#B01020';
    b.style.borderBottom = '2px solid #B01020';
    b.style.fontStyle = 'italic';
  }
});
</script>
</body>
</html>
